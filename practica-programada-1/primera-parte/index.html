<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Formulario de Registro</h1>
    <p>Por favor, completa la siguiente información para crear tu cuenta.</p>
    
    <form action="#">
      <fieldset>
        <label for="first-name">Nombre: <input id="first-name" type="text" required /></label>
        <label for="last-name">Apellido: <input id="last-name" type="text" required /></label>
        <label for="email">Correo electrónico: <input id="email" type="email" required /></label>
        <label for="new-password">Contraseña: <input id="new-password" type="password" pattern="[a-z0-9]{8,}" required /></label>
      </fieldset>
      
      <fieldset>
        <legend>Tipo de Cuenta</legend>
        <label for="personal-account"><input id="personal-account" type="radio" name="account-type" checked /> Personal</label>
        <label for="business-account"><input id="business-account" type="radio" name="account-type" /> Empresarial</label>
      </fieldset>

      <fieldset>
        <label for="terms-and-conditions">
          <input id="terms-and-conditions" type="checkbox" required /> Acepto los términos y condiciones
        </label>
      </fieldset>
      
      <input type="submit" value="Enviar" />
    </form>
  </div>
</body>
</html>
